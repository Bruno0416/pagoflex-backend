name: pagoflex-backend

# --- plantilla reutilizable para health checks ---
x-healthcheck-template: &default-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:$${PORT:-8761}/actuator/health || exit 1"]
  interval: 30s
  timeout: 7s
  retries: 3
  start_period: 40s

# --- readiness despues de completar los application runners ---
x-readiness-healthcheck-template: &readiness-healthcheck
  <<: *default-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:$${PORT}/actuator/health/readiness || exit 1"]

services:
  db-init:
    networks:
      - backend
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?Falta DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      USUARIOS_DB: ${USUARIOS_DB:?Falta USUARIOS_DB}
      USUARIOS_USER: ${USUARIOS_USER:?Falta USUARIOS_USER}
      USUARIOS_PASS: ${USUARIOS_PASS:?Falta USUARIOS_PASS}
      COBRANZA_DB: ${COBRANZA_DB:?Falta COBRANZA_DB}
      COBRANZA_USER: ${COBRANZA_USER:?Falta COBRANZA_USER}
      COBRANZA_PASS: ${COBRANZA_PASS:?Falta COBRANZA_PASS}
      RECONOCIMIENTOS_DB: ${RECONOCIMIENTOS_DB:?Falta RECONOCIMIENTOS_DB}
      RECONOCIMIENTOS_USER: ${RECONOCIMIENTOS_USER:?Falta RECONOCIMIENTOS_USER}
      RECONOCIMIENTOS_PASS: ${RECONOCIMIENTOS_PASS:?Falta RECONOCIMIENTOS_PASS}
      SOPORTE_DB: ${SOPORTE_DB:?Falta SOPORTE_DB}
      SOPORTE_USER: ${SOPORTE_USER:?Falta SOPORTE_USER}
      SOPORTE_PASS: ${SOPORTE_PASS:?Falta SOPORTE_PASS}
      MENSAJERIA_DB: ${MENSAJERIA_DB:?Falta MENSAJERIA_DB}
      MENSAJERIA_USER: ${MENSAJERIA_USER:?Falta MENSAJERIA_USER}
      MENSAJERIA_PASS: ${MENSAJERIA_PASS:?Falta MENSAJERIA_PASS}
    volumes:
      - ./db-init/init.sh:/opt/pagoflex/init.sh:ro
    entrypoint: ["/bin/bash", "/opt/pagoflex/init.sh"]

  # ---- MYSQL ----
  mysql:
    image: mysql:8.4
    command: [ "--partial-revokes=ON" ]
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
          - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [ backend ]
    healthcheck:
      test: [ CMD-SHELL, 'mysqladmin ping --host=127.0.0.1 --silent' ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ---- REDIS ----
  redis:
    image: redis:8.8.3-alpine
    command: [ redis-server, --save, '', --appendonly, 'no' ]
    networks: [ backend ]
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---- GATEWAY ----
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
      cobranza-service:
        condition: service_healthy
      soporte-service:
        condition: service_healthy
      reconocimientos-service:
        condition: service_healthy
      mensajeria-service:
        condition: service_healthy
    environment:
      - PORT=${API_GATEWAY_PORT:-8080}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]
    ports: [ '${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}' ]

  # ---- EUREKA ----
  eureka-server:
    build:
      context: ..
      dockerfile: services/eureka-server/Dockerfile
    env_file: .env
    environment:
      - PORT=${EUREKA_PORT:-8761}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]

  # ---- USUARIOS ----
  usuarios-service:
    build:
      context: ..
      dockerfile: services/usuarios-service/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      cobranza-service:
        condition: service_healthy
    environment:
      - PORT=${USUARIOS_PORT:-8081}
      - AVATAR_STORAGE_DIR=/data/avatars
    volumes:
      - usuarios-avatars:/data/avatars
    healthcheck:
      <<: *readiness-healthcheck
    networks: [ backend ]

  # ---- RECONOCIMIENTOS ----
  reconocimientos-service:
    build:
      context: ..
      dockerfile: services/reconocimientos-service/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - PORT=${RECONOCIMIENTOS_PORT:-8086}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]

  # ---- EMAIL ----
  email-service:
    build:
      context: ..
      dockerfile: services/email-service/Dockerfile
    env_file: .env
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - PORT=${EMAIL_PORT:-8082}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]

  # ---- COBRANZA ----
  cobranza-service:
    build:
      context: ..
      dockerfile: services/cobranza-service/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - PORT=${COBRANZA_PORT:-8083}
    healthcheck:
      <<: *readiness-healthcheck
    networks: [ backend ]

  # ---- SOPORTE ----
  soporte-service:
    build:
      context: ..
      dockerfile: services/soporte-service/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
      cobranza-service:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - PORT=${SOPORTE_PORT:-8084}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]

  # ---- MENSAJERIA ----
  mensajeria-service:
    build:
      context: ..
      dockerfile: services/mensajeria-service/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      soporte-service:
        condition: service_healthy
      cobranza-service:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - PORT=${MENSAJERIA_PORT:-8085}
    healthcheck:
      <<: *default-healthcheck
    networks: [ backend ]

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  usuarios-avatars:
