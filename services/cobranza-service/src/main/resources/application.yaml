server:
  port: ${COBRANZA_PORT:8083}

spring:
  application:
    name: cobranza-service

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${COBRANZA_DB}
    username: ${COBRANZA_USER}
    password: ${COBRANZA_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

pagoflex:
  zona-horaria: America/Santiago
  # datos de ejemplo del anexo 9 para probar la app conectada
  demo:
    enabled: ${DEMO_DATA:false}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    jwt:
      secret: ${JWT_SECRET}
    public-paths:
      - /actuator/health

eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

usuarios-service:
  api:
    base-url: ${USUARIOS_API_URL:http://usuarios-service:${USUARIOS_PORT:8081}/api/v1/usuarios/internal}

reconocimientos-service:
  api:
    base-url: ${RECONOCIMIENTOS_API_URL:http://reconocimientos-service:${RECONOCIMIENTOS_PORT:8086}/api/v1/internal/reconocimientos}
