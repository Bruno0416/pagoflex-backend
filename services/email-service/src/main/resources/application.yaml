server:
  port: ${EMAIL_PORT:8082}

spring:
  application:
    name: email-service
  cloud:
    loadbalancer:
      cache:
        enabled: false   # eureka ya mantiene el registro en memoria; no se agrega caffeine

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

pagoflex:
  security:
    internal-api-key: ${INTERNAL_API_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
