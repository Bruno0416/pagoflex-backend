spring:
  application:
    name: soporte-service

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false

  datasource:
    url: jdbc:h2:mem:soporte;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

pagoflex:
  security:
    internal-api-key: test-only-internal-api-key
    jwt:
      secret: test-only-jwt-secret-that-has-at-least-32-bytes
    public-paths:
      - /actuator/health

cobranza-service:
  api:
    base-url: http://localhost:0/api/v1/internal

usuarios-service:
  api:
    base-url: http://localhost:0/api/v1/internal
