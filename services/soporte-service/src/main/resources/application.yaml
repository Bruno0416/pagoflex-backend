server:
  port: ${SOPORTE_PORT:8084}

spring:
  application:
    name: soporte-service

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${SOPORTE_DB}
    username: ${SOPORTE_USER}
    password: ${SOPORTE_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

pagoflex:
  # fotos de comprobante, igual que los avatares de usuarios
  storage:
    comprobantes:
      path: ${COMPROBANTE_STORAGE_DIR:./data/comprobantes}
  zona-horaria: America/Santiago
  # datos de ejemplo del anexo 9 para probar la app conectada
  demo:
    enabled: ${DEMO_DATA:false}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    jwt:
      secret: ${JWT_SECRET}
    public-paths:
      - /openapi/soporte
      - /actuator/health

cobranza-service:
  api:
    base-url: ${COBRANZA_API_URL:http://cobranza-service:${COBRANZA_PORT:8083}/api/v1/internal}

# solo lo usa la carga demo para conocer el uuid de las cuentas de ejemplo
usuarios-service:
  api:
    base-url: ${USUARIOS_API_URL:http://usuarios-service:${USUARIOS_PORT:8081}/api/v1/usuarios/internal}

eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /openapi/soporte
  paths-to-match: /api/v1/**
  paths-to-exclude:
    - /api/v1/internal/**
    - /api/v1/usuarios/internal/**
