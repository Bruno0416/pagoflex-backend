server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server
  cloud:
    loadbalancer:
      cache:
        enabled: false   # eureka ya mantiene el registro en memoria; no se agrega caffeine

  security:
    user:
      name: admin
      password: ${EUREKA_ADMIN_PASSWD}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
