spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-service
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/auth/**

eureka:
  client:
    enabled: false

pagoflex:
  security:
    jwt:
      secret: test-only-jwt-secret-that-has-at-least-32-bytes
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/recovery
      - /api/v1/auth/recovery/verify
      - /api/v1/auth/recovery/resend
      - /api/v1/auth/recovery/reset
      - /actuator/health
