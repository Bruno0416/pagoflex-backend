spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  cloud:
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-service
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/auth/**
            - id: reconocimientos-service
              uri: lb://reconocimientos-service
              predicates:
                - Path=/api/v1/reconocimientos/**

eureka:
  client:
    enabled: false

pagoflex:
  security:
    jwt:
      secret: test-only-jwt-secret-that-has-at-least-32-bytes
    public-paths:
      - /api/v1/auth/iniciar-sesion
      - /api/v1/auth/registro
      - /api/v1/auth/renovar
      - /api/v1/auth/recuperacion
      - /api/v1/auth/recuperacion/verificar
      - /api/v1/auth/recuperacion/reenviar
      - /api/v1/auth/recuperacion/restablecer
      - /actuator/health

management:
  health:
    redis:
      enabled: false
