server:
  port: 8080
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-service
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/auth/**
            - id: usuarios-service-private
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/usuarios/**
            - id: mensajeria-service
              uri: lb://mensajeria-service
              predicates:
                - Path=/api/v1/conversaciones/**
            # soporte va antes que cobranza: comparte el prefijo /api/v1/empresas/me
            - id: soporte-service
              uri: lb://soporte-service
              predicates:
                - Path=/api/v1/reportes,/api/v1/reportes/**,/api/v1/empresas/me/reportes,/api/v1/empresas/me/reportes/**,/api/v1/empresas/me/compromisos/*/reporte-activo
            - id: cobranza-service
              uri: lb://cobranza-service
              predicates:
                - Path=/api/v1/compromisos/**,/api/v1/pagos/**,/api/v1/comprobantes/**,/api/v1/anulaciones/**,/api/v1/cumplimiento/**,/api/v1/empresas/me,/api/v1/empresas/me/**

pagoflex:
  security:
    jwt:
      secret: ${JWT_SECRET}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/recovery
      - /api/v1/auth/recovery/verify
      - /api/v1/auth/recovery/resend
      - /api/v1/auth/recovery/reset
      - /actuator/health


eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
