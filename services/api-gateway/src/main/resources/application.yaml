server:
  port: 8080
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-service
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/auth/**
            - id: usuarios-service-private
              uri: lb://usuarios-service
              predicates:
                - Path=/api/v1/usuarios/**

pagoflex:
  security:
    jwt:
      secret: ${JWT_SECRET}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/recovery
      - /api/v1/auth/recovery/verify
      - /api/v1/auth/recovery/resend
      - /api/v1/auth/recovery/reset
      - /actuator/health


eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
