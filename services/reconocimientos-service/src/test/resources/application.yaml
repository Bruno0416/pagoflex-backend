spring:
  application:
    name: reconocimientos-service
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  cloud:
    loadbalancer:
      cache:
        enabled: false

  datasource:
    url: jdbc:h2:mem:reconocimientos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

eureka:
  client:
    enabled: false

pagoflex:
  security:
    internal-api-key: test-only-internal-api-key
    jwt:
      secret: test-only-jwt-secret-that-has-at-least-32-bytes
    public-paths:
      - /actuator/health
  reconocimientos:
    zona-horaria: America/Santiago
    cobranza:
      base-url: http://127.0.0.1:1/api/v1/internal

management:
  health:
    redis:
      enabled: false

# las pruebas de concurrencia provocan violaciones de unicidad a proposito; hibernate las registra como WARN
logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR
