server:
  port: ${USUARIOS_PORT:8081}

spring:
  application:
    name: usuarios-service
  cloud:
    loadbalancer:
      cache:
        enabled: false   # eureka ya mantiene el registro en memoria; no se agrega caffeine

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${USUARIOS_DB}
    username: ${USUARIOS_USER}
    password: ${USUARIOS_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

pagoflex:
  storage:
    avatars:
      path: ${AVATAR_STORAGE_DIR:./data/avatars}
  # cuentas de ejemplo de la app para probarla conectada
  demo:
    enabled: ${DEMO_DATA:false}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    public-paths:
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /api/v1/auth/iniciar-sesion
      - /api/v1/auth/registro
      - /api/v1/auth/renovar
      - /api/v1/auth/recuperacion
      - /api/v1/auth/recuperacion/verificar
      - /api/v1/auth/recuperacion/reenviar
      - /api/v1/auth/recuperacion/restablecer
      - /actuator/health

verification:
  code:
    expiration-minutes: ${RECOVERY_CODE_EXPIRATION_MINUTES}
  reset:
    expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES}

cobranza-service:
  api:
    base-url: ${COBRANZA_API_URL:http://cobranza-service:${COBRANZA_PORT:8083}/api/v1/internal/empresas}

email-service:
  api:
    base-url: http://email-service:${EMAIL_PORT:8082}/api/v1/email/internal

eureka:
  client:
    service-url:
      defaultZone: http://admin:${EUREKA_ADMIN_PASSWD}@eureka-server:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
