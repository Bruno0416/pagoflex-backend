spring:
  application:
    name: usuarios-service
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  cloud:
    loadbalancer:
      cache:
        enabled: false

  datasource:
    url: jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false

pagoflex:
  security:
    internal-api-key: test-only-internal-api-key
    jwt:
      secret: test-only-jwt-secret-that-has-at-least-32-bytes
      expiration: 15m
      refresh-expiration: 7d
    public-paths:
      - /api/v1/auth/iniciar-sesion
      - /api/v1/auth/registro
      - /api/v1/auth/renovar
      - /api/v1/auth/recuperacion
      - /api/v1/auth/recuperacion/verificar
      - /api/v1/auth/recuperacion/reenviar
      - /api/v1/auth/recuperacion/restablecer
      - /actuator/health

cobranza-service:
  api:
    base-url: http://localhost:18083/api/v1/internal/empresas

email-service:
  api:
    base-url: http://localhost:8082/api/v1/email/internal

verification:
  code:
    expiration-minutes: 10
  reset:
    expiration-minutes: 10

management:
  health:
    redis:
      enabled: false
